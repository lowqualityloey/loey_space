name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Build, Typecheck & Validate
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 TypeScript Typecheck
        run: npm run typecheck

      # Runs before the bundle step on purpose: `npm run build` overwrites the
      # committed bundles in the checkout, which would repair the very drift this
      # step exists to catch. The guard rebuilds into a temp directory instead, so
      # it sees the committed bytes no matter what runs after it.
      - name: 🔒 Verify Committed Bundles Match Sources
        run: npm run check-bundles

      - name: ⚡ esbuild Bundle Scripts
        run: npm run build

      - name: 🧪 Run Unit Test Suite
        run: npm test

      - name: 📋 Validate Vault Templates
        run: npm run validate-templates

      # `--strict` is the whole point of this step. Without it the auditor prints its findings
      # and exits 0 regardless, so a broken wikilink in a tracked note could never fail a
      # build. Enabling it needed the auditor to stop calling links to content that is
      # gitignored by design "broken" (#101) — a tracked MOC linking its own untracked content
      # is the vault's architecture, not a defect, and `--strict` gates on the rest.
      - name: 🔍 Audit Vault Wikilinks
        run: npm run audit-links -- --strict

      # The same argument: a report whose findings do not fail the build is documentation.
      - name: 🩺 Audit Vault Hygiene
        run: npm run hygiene -- --strict

      - name: 🔐 Scan Tracked Artifacts For Secrets
        run: bash .githooks/lib/secret-scan.sh --tracked
