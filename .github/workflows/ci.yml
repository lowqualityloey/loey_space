name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Build, Typecheck & Validate
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 TypeScript Typecheck
        run: npm run typecheck

      - name: ⚡ esbuild Bundle Scripts
        run: npm run build

      - name: 🧪 Run Unit Test Suite
        run: npm test

      - name: 📋 Validate Vault Templates
        run: npm run validate-templates
